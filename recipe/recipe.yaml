schema_version: 1

context:
  version: "3.0.1"

package:
  name: carterbox-torch-radon
  version: ${{ version }}

source:
  url: https://github.com/carterbox/torch-radon/releases/download/v${{ version }}/torch-radon-v${{ version }}.zip
  sha256: 32af1ba286f9067c6cac28f85f7405ea75a66d92ca02593a07ba67a9ab46d6cc

build:
  # pytorch in conda-forge does not support CUDA 11.8 as of v2.5
  # Windows compile fails with syntax errors
  number: 0
  skip:
    - win
    - cuda_compiler_version in (None, "None")
  script:
    content: |
      export TORCH_CUDA_ARCH_LIST="${CF_TORCH_CUDA_ARCH_LIST}"
      python -m pip install . --no-deps -vvv

requirements:
  build:
    - ${{ compiler('cuda') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - cuda-version ${{ cuda_compiler_version }}.*
    - cuda-cudart-dev
    - libcurand-dev
    - python
    - pip
    - pytorch
    # We must have the CUDA variant of pytorch
    - pytorch * cuda*
    - libtorch
    - setuptools
    - setuptools-scm
    - toml
  run:
    - __cuda
    - python
    - pytorch * cuda*
    - scipy
    - numpy

tests:
  - requirements:
      run:
        - pip
    script:
      - pip check

about:
  summary: Tomography operators for Pytorch
  description: |
    TorchRadon is a PyTorch extension written in CUDA that implements
    differentiable tomography operators.
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/carterbox/torch-radon

extra:
  recipe-maintainers:
    - carterbox
